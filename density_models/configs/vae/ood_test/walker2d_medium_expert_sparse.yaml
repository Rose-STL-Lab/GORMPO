# VAE OOD Level Test Configuration for Walker2d-Medium-Expert-v2 (Sparse Dataset)
# Configuration for testing OOD detection at different distance levels

# Model path (without extension)
model_path: "checkpoints/walker2d_medium_expert_sparse/vae_42/vae_42"

# Dataset configuration
dataset_name: "walker2d-medium-expert-v2"
sparse_dataset_name: "walker2d_medium_expert_sparse_73"

# OOD test data configuration
base_path: "data/ood_test"
distances: [0.4, 0.6, 0.8, 1]
suffix: "-uniform"  # Use -uniform OOD test files

# Hardware
device: "cuda"

# Output
save_dir: "figures/vae_ood_distance_tests"

# Example usage:
# python density_models/test_vae_ood_levels.py --config density_models/configs/vae/ood_test/walker2d_medium_expert_sparse.yaml
