# KDE OOD Level Test Configuration for Walker2d-Medium-Expert-v2 (Sparse Dataset)
# Configuration for testing OOD detection at different distance levels

# Model path (without extension)
model_path: "checkpoints/hopper_medium_expert_sparse/kde_42/kde_42"

# Dataset configuration
dataset_name: "hopper-medium-expert-v2"
sparse_dataset_name: "hopper_medium_expert_sparse_78"

# OOD test data configuration
base_path: "data/ood_test"
distances: [1, 1.2, 1.4, 1.6, 1.8]
suffix: "-uniform"  # Use -uniform OOD test files

# Hardware
device: "cuda"

# Output
save_dir: "figures/kde_ood_distance_tests"

# Example usage:
# python density_models/test_kde_ood_levels.py --config density_models/configs/kde/ood_test/walker2d_medium_expert_sparse.yaml
