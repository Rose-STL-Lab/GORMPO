# GORMPO Training Configuration for HalfCheetah-Medium-Expert-Sparse with VAE
# This config is used with mopo.py to train GORMPO using a pre-trained VAE density model

task: halfcheetah-medium-expert-v2
algo-name: gormpo
reward-penalty-coef: 0.1
seed: 1
data_path: data/sparse_datasets/halfcheetah_medium_expert_sparse_72.5.pkl
epoch: 3000
dynamics-model-dir: auto
rollout-length: 5
penalty_type: tanh
classifier_model_name: checkpoints/halfcheetah_medium_expert_sparse/vae_42/vae_42
density_model: vae
target_dim: 23  # 17 (obs) + 6 (action) for HalfCheetah
